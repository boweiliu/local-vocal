# local-vocal: on-device VAD, live streaming speech-to-text, and text-to-speech
# in the browser -- no API key, no server round-trip. Source:
# github.com/DanverImbue/local-vocal (v1 template), symlinked at
# system/apps/local_vocal. Its own default port (8084) collides with
# minds-apps-homepage in this workspace, so it's moved to 8085 via
# LOCAL_VOCAL_PORT.
[program:local-vocal]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project system/apps/local_vocal && uv sync --locked --project system/apps/local_vocal && python3 system/scripts/forward_port.py --url http://localhost:8085 --name local-vocal --icon-file .app-icons/local-vocal.svg --program local-vocal && LOCAL_VOCAL_PORT=8085 exec system/apps/local_vocal/.venv/bin/local-vocal"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/local-vocal-stdout.log
stderr_logfile=/var/log/supervisor/local-vocal-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
